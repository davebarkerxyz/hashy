# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  BINARY_NAME: hashy
  PLATFORMS:
    - { os: linux, arch: amd64 }
    - { os: linux, arch: arm64 }
    - { os: darwin, arch: arm64 }
    - { os: windows, arch: amd64, ext: .exe }
  VERSION: '{{.VERSION | default .ENV_VERSION | default "dev"}}'

tasks:
  default:
    cmds:
      - task: build

  build:
    desc: Compile development build to build/{{.BINARY_NAME}}{{exeExt}}
    cmds:
      - go build -o build/{{.BINARY_NAME}}{{exeExt}} ./

  build-all:
    desc: Build the application for all targeted platforms
    cmds:
      - for: { var: PLATFORMS }
        task: compile-release
        vars:
          TARGET_OS: '{{.ITEM.os}}'
          TARGET_ARCH: '{{.ITEM.arch}}'
          EXTENSION: '{{.ITEM.ext | default ""}}'

  compile-release:
    desc: Compile release build in versioned build directory (called from build-release)
    internal: true
    env:
      GOOS: '{{.TARGET_OS}}'
      GOARCH: '{{.TARGET_ARCH}}'
    cmds:
      - echo "Building for {{.TARGET_OS}} on {{.TARGET_ARCH}}..."
      - go build -o build/{{.VERSION}}/{{.BINARY_NAME}}-{{.TARGET_OS}}-{{.TARGET_ARCH}}{{.EXTENSION}} -ldflags="-X main.version={{.VERSION}}" ./

  build-release:
    desc: Build for all platforms and create (and push) git release 
    cmds:
      - task: build-all
      - git tag -a {{.VERSION}} -m "Release {{.VERSION}}"
      - git push origin {{.VERSION}}
      - git push
